AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Layer 4 - AgentCore Runtime. Creates AWS::BedrockAgentCore::Runtime in VPC
  network mode, pointing at the ARM64 image in ECR (Layer 3) and the execution
  role (Layer 1) and subnets/SG (Layer 2). Updating ContainerImageUri creates a
  new immutable runtime version and auto-updates the DEFAULT endpoint (no
  downtime). Deploy this LAST, after the first image has been pushed.

Parameters:
  ProjectName:
    Type: String
    Default: bedrock-agentcore
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, test, prod]
  AgentName:
    Type: String
    Description: AgentRuntimeName (pattern [a-zA-Z][a-zA-Z0-9_]{0,47}). MUST match the AgentName used in Layer 1.
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,47}"
  ContainerImageUri:
    Type: String
    Description: >
      Full ECR image URI WITH tag or digest, e.g.
      123456789012.dkr.ecr.us-east-1.amazonaws.com/bedrock-agentcore-prod:ab12cd34
      (take EcrRepositoryUri from Layer 3 + the tag from the build's imageDetail.json).
    AllowedPattern: "^\\d{12}\\.dkr\\.ecr\\.([a-z0-9-]+)\\.amazonaws\\.com/.+[:@]\\S+$"
  RuntimeExecutionRoleArn:
    Type: String
    Description: From Layer 1 Output RuntimeExecutionRoleArn.
  RuntimeSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: From Layer 2 Output PrivateSubnetIds.
  RuntimeSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: From Layer 2 Output RuntimeSecurityGroupId.
  Protocol:
    Type: String
    Default: HTTP
    AllowedValues: [HTTP, MCP, A2A, AGUI]
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: Passed to the agent container as the BEDROCK_MODEL_ID env var.

Resources:
  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Ref AgentName
      Description: !Sub "${ProjectName} Strands agent (${Environment})"
      RoleArn: !Ref RuntimeExecutionRoleArn
      ProtocolConfiguration: !Ref Protocol
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref ContainerImageUri
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets: !Ref RuntimeSubnetIds
          SecurityGroups: !Ref RuntimeSecurityGroupIds
      EnvironmentVariables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

Outputs:
  AgentRuntimeArn:
    Value: !GetAtt AgentRuntime.AgentRuntimeArn
  AgentRuntimeId:
    Value: !GetAtt AgentRuntime.AgentRuntimeId
  AgentRuntimeVersion:
    Value: !GetAtt AgentRuntime.AgentRuntimeVersion
  AgentRuntimeStatus:
    Value: !GetAtt AgentRuntime.Status
