AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AgentCore Gateway with no authentication, a Lambda-backed GatewayTarget, and two demo tools (echo, add_numbers).

# Adds AWS::BedrockAgentCore::GatewayTarget to the baseline from 01.
# Lambda target requires dual permissions: gateway role IAM policy + Lambda resource-based policy.
# ToolSchema.InlinePayload declares tools via ToolDefinition / SchemaDefinition.

Parameters:

  ApplicationName:
    Type: String
    Default: bedrock-agentcore

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]

  SessionTimeoutSeconds:
    Type: Number
    Default: 3600
    MinValue: 900
    MaxValue: 28800

Resources:

  # --- ToolLambdaRole ---
  ToolLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-tool-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - { Key: Application, Value: !Ref ApplicationName }
        - { Key: Environment, Value: !Ref Environment }

  # --- ToolLambda ---
  # Implements MCP tools/list and tools/call for the echo and add_numbers tools.
  # Event: { "method": "tools/call", "params": { "name": "...", "arguments": {...} } }
  # Response: { "content": [{ "type": "text", "text": "..." }], "isError": false }
  ToolLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ApplicationName}-tools-${Environment}"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ToolLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import json, logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def tool_echo(args):
              return f"Echo: {args.get('message', '')}"

          def tool_add_numbers(args):
              a, b = args.get("a", 0), args.get("b", 0)
              return f"{a} + {b} = {a + b}"

          TOOLS = {"echo": tool_echo, "add_numbers": tool_add_numbers}

          def mcp_result(text): return {"content": [{"type": "text", "text": text}], "isError": False}
          def mcp_error(text):  return {"content": [{"type": "text", "text": text}], "isError": True}

          def handler(event, context):
              logger.info(json.dumps({"event": event}))
              method = event.get("method", "")

              if method == "tools/list":
                  return {"tools": [
                      {"name": "echo", "description": "Returns the input message unchanged.",
                       "inputSchema": {"type": "object", "properties": {"message": {"type": "string"}}, "required": ["message"]}},
                      {"name": "add_numbers", "description": "Adds two numbers and returns the sum.",
                       "inputSchema": {"type": "object", "properties": {"a": {"type": "number"}, "b": {"type": "number"}}, "required": ["a", "b"]}},
                  ]}

              if method == "tools/call":
                  params = event.get("params", {})
                  name   = params.get("name", "")
                  fn     = TOOLS.get(name)
                  if not fn:
                      return mcp_error(f"Unknown tool: {name!r}")
                  try:
                      return mcp_result(fn(params.get("arguments", {})))
                  except Exception as e:
                      return mcp_error(f"Tool {name!r} failed: {e}")

              return mcp_error(f"Unsupported method: {method!r}")
      Tags:
        - { Key: Application, Value: !Ref ApplicationName }
        - { Key: Environment, Value: !Ref Environment }

  # --- ToolLambdaPermission ---
  # Resource-based policy: allows bedrock-agentcore to invoke the function.
  # Required in addition to the lambda:InvokeFunction grant on GatewayRole.
  ToolLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ToolLambda.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # --- GatewayRole ---
  # Assumed by bedrock-agentcore for outbound calls (CloudWatch Logs + invoke ToolLambda).
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-gw-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAgentCoreAssumeRole
            Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: gateway-execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"
              - Sid: InvokeToolLambda # IAM side of the dual-permission requirement
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ToolLambda.Arn
      Tags:
        - { Key: Application, Value: !Ref ApplicationName }
        - { Key: Environment, Value: !Ref Environment }

  # --- Gateway ---
  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub "${ApplicationName}-gw-${Environment}"
      RoleArn: !GetAtt GatewayRole.Arn
      AuthorizerType: NONE
      ExceptionLevel: DEBUG
      ProtocolConfiguration:
        Mcp:
          Instructions: "Demo gateway with echo and add_numbers tools. No authentication required."
          SessionConfiguration:
            SessionTimeoutInSeconds: !Ref SessionTimeoutSeconds
          StreamingConfiguration:
            EnableResponseStreaming: false
      Description: "Demo gateway — no auth, Lambda target with echo and add_numbers tools"
      Tags:
        Application: !Ref ApplicationName
        Environment: !Ref Environment

  # --- GatewayTarget ---
  # Binds ToolLambda to the gateway and declares its tools via inline ToolSchema.
  # GatewayIdentifier change forces replacement of this resource.
  GatewayTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      Name: !Sub "${ApplicationName}-target-tools-${Environment}"
      Description: "Lambda target exposing echo and add_numbers tools"
      GatewayIdentifier: !GetAtt Gateway.GatewayIdentifier # pattern: ^([0-9a-z][-]?){1,100}-[0-9a-z]{10}$
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn: !GetAtt ToolLambda.Arn
            ToolSchema:
              InlinePayload:
                - Name: echo
                  Description: "Returns the input message unchanged."
                  InputSchema:
                    Type: object
                    Properties:
                      message:
                        Type: string
                        Description: "The message to echo back."
                    Required:
                      - message
                  OutputSchema:
                    Type: object
                    Properties:
                      result:
                        Type: string

                - Name: add_numbers
                  Description: "Adds two numbers and returns their sum."
                  InputSchema:
                    Type: object
                    Properties:
                      a:
                        Type: number
                        Description: "First number."
                      b:
                        Type: number
                        Description: "Second number."
                    Required:
                      - a
                      - b
                  OutputSchema:
                    Type: object
                    Properties:
                      sum:
                        Type: number
      # GATEWAY_IAM_ROLE: gateway signs Lambda invocations using its own execution role.
      # Other options: OAUTH | API_KEY | CALLER_IAM_CREDENTIALS | JWT_PASSTHROUGH
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE

Outputs:

  GatewayArn:
    Value: !GetAtt Gateway.GatewayArn

  GatewayIdentifier:
    Value: !GetAtt Gateway.GatewayIdentifier

  GatewayUrl:
    Value: !GetAtt Gateway.GatewayUrl

  GatewayStatus:
    Value: !GetAtt Gateway.Status

  GatewayTargetId:
    Value: !GetAtt GatewayTarget.TargetId

  GatewayTargetStatus:
    Value: !GetAtt GatewayTarget.Status

  ToolLambdaArn:
    Value: !GetAtt ToolLambda.Arn

  ToolLambdaName:
    Value: !Ref ToolLambda
