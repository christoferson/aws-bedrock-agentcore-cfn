AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AgentCore Gateway with no authentication (NONE), MCP protocol, and a gateway execution role.

# Demonstrates the minimal resource structure: GatewayRole + Gateway.
# AuthorizerType: NONE — any caller can invoke (dev/testing only).
# ExceptionLevel: DEBUG — full error details in responses.

Parameters:

  ApplicationName:
    Type: String
    Default: bedrock-agentcore
    Description: Prefix for all resource names.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]

  GatewayDescription:
    Type: String
    Default: "Demo gateway — no auth, MCP protocol"

  SessionTimeoutSeconds:
    Type: Number
    Default: 3600
    MinValue: 900   # 15 min
    MaxValue: 28800 # 8 hr

Resources:

  # --- GatewayRole ---
  # Assumed by bedrock-agentcore to make outbound calls (e.g. CloudWatch Logs).
  # SourceAccount condition prevents confused-deputy attacks.
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-gateway-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAgentCoreAssumeRole
            Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: gateway-basic
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"
      Tags:
        - { Key: Application, Value: !Ref ApplicationName }
        - { Key: Environment, Value: !Ref Environment }

  # --- Gateway ---
  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub "${ApplicationName}-gw-${Environment}" # pattern: ^([0-9a-zA-Z][-]?){1,100}$; change forces replacement
      RoleArn: !GetAtt GatewayRole.Arn
      AuthorizerType: NONE # NONE | AWS_IAM | CUSTOM_JWT | AUTHENTICATE_ONLY
      ExceptionLevel: DEBUG # omit in stg/prd to avoid leaking internals
      ProtocolConfiguration:
        Mcp:
          Instructions: !Sub >
            Demo AgentCore Gateway (${Environment}). No tools attached yet.
          # SearchType: SEMANTIC  # uncomment to enable embedding-based tool discovery
          SessionConfiguration:
            SessionTimeoutInSeconds: !Ref SessionTimeoutSeconds
          StreamingConfiguration:
            EnableResponseStreaming: false
      Description: !Ref GatewayDescription
      Tags:
        Application: !Ref ApplicationName
        Environment: !Ref Environment

Outputs:

  GatewayArn:
    Value: !GetAtt Gateway.GatewayArn

  GatewayIdentifier:
    Value: !GetAtt Gateway.GatewayIdentifier

  GatewayUrl:
    Value: !GetAtt Gateway.GatewayUrl

  GatewayStatus:
    Value: !GetAtt Gateway.Status

  GatewayRoleArn:
    Value: !GetAtt GatewayRole.Arn

  CreatedAt:
    Value: !GetAtt Gateway.CreatedAt
