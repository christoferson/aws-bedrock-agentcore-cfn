# Stack 1/3 (private) — IAM. Deploy first; harness stack consumes HarnessExecutionRoleArn.
# Source for permissions: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role — HarnessExecutionRole for VPC-mode harness

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]

Resources:

  # --- Harness execution role (assumed by the AgentCore Harness managed loop) ---
  HarnessExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-harness-vpc-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: harness-vpc-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Sid: BedrockModels
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*"

              # ECR Public authentication — both actions required together (no VPC endpoint for ECR Public)
              - Sid: EcrPublicToken
                Effect: Allow
                Action: ecr-public:GetAuthorizationToken
                Resource: "*"

              - Sid: StsEcrPublicBearer
                Effect: Allow
                Action: sts:GetServiceBearerToken
                Resource: "*"

              - Sid: XRay
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords,
                         xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"

              - Sid: CloudWatchLogsGroup
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DescribeLogStreams]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"

              - Sid: CloudWatchLogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"

              - Sid: CloudWatchLogsStream
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*"

              - Sid: CloudWatchMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore

              # Session event store — required on every invocation even without explicit Memory config
              - Sid: MemoryEvents
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:DeleteEvent
                  - bedrock-agentcore:RetrieveMemoryRecords
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/*"

              # Browser sessions — "aws" account segment = built-in browser
              - Sid: BrowserSessionsBuiltin
                Effect: Allow
                Action:
                  - bedrock-agentcore:StartBrowserSession
                  - bedrock-agentcore:StopBrowserSession
                  - bedrock-agentcore:GetBrowserSession
                  - bedrock-agentcore:ListBrowserSessions
                  - bedrock-agentcore:UpdateBrowserStream
                  - bedrock-agentcore:ConnectBrowserAutomationStream
                  - bedrock-agentcore:ConnectBrowserLiveViewStream
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:aws:browser/*"

              # Code interpreter sessions — "aws" account segment = built-in interpreter
              - Sid: CodeInterpreterSessionsBuiltin
                Effect: Allow
                Action:
                  - bedrock-agentcore:StartCodeInterpreterSession
                  - bedrock-agentcore:StopCodeInterpreterSession
                  - bedrock-agentcore:GetCodeInterpreterSession
                  - bedrock-agentcore:ListCodeInterpreterSessions
                  - bedrock-agentcore:InvokeCodeInterpreter
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:aws:code-interpreter/*"

      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  HarnessExecutionRoleArn:
    Value: !GetAtt HarnessExecutionRole.Arn
