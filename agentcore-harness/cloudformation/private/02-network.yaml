# Stack 2/3 (private) — AgentCore/Bedrock VPC endpoints and security groups only.
# Assumes an existing VPC with private subnets that already have NAT or internet access.
#
# IMPORTANT — ECR Public and NAT Gateway requirement:
#   The Harness pulls its application container from Amazon ECR Public (public.ecr.aws)
#   at the start of each session. When running in VPC mode, your VPC must allow outbound
#   access to public.ecr.aws. Amazon ECR Public does not support VPC endpoints, so your
#   VPC must have a NAT gateway with a route to an internet gateway. If this connectivity
#   is not available, sessions will fail to start due to image pull timeouts.
#
# NOTE: An S3 Gateway endpoint (com.amazonaws.{region}.s3) is also recommended to avoid
# NAT charges for ECR private layer pulls, but it requires a private route table ID as input.
# Add it separately to your existing VPC if needed — it is free.
AWSTemplateFormatVersion: "2010-09-09"
Description: AgentCore/Bedrock VPC endpoints and security groups

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
      - Label:
          default: Existing Network
        Parameters:
          - VpcId
          - VpcCidr
          - PrivateSubnetIds
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)
      VpcId:
        default: Existing VPC ID
      VpcCidr:
        default: VPC CIDR block (used to scope endpoint SG ingress)
      PrivateSubnetIds:
        default: Private subnet IDs (comma-separated)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the existing VPC
  VpcCidr:
    Type: String
    Description: CIDR of the existing VPC, e.g. 10.0.0.0/16
    Default: "10.0.0.0/16"
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Comma-separated list of existing private subnet IDs

Resources:

  # --- Security group for interface endpoint ENIs ---
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from VPC
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr  # allow HTTPS from any resource in this VPC
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationName}-${Environment}-endpoint-sg"

  # --- Harness security group (applied to Runtime ENIs created by AgentCore) ---
  HarnessSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Harness egress HTTPS only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"  # reaches VPC endpoint ENIs (via DNS) and NAT for ECR Public
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationName}-${Environment}-harness-sg"

  # =========================================================================
  # VPC Interface Endpoints
  # Three separate AgentCore endpoints — each covers a different service domain:
  #   bedrock-agentcore         — data plane (Runtime, Memory, Browser, Code Interpreter)
  #   bedrock-agentcore.gateway — Gateway data plane (Harness → Gateway tool calls)
  #   bedrock-agentcore-control — control plane (create/update/delete resources)
  # =========================================================================

  # AgentCore data plane: Runtime invoke, Memory events, Built-in Tools, Identity
  BedrockAgentCoreEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-agentcore"
      VpcEndpointType: Interface
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true

  # AgentCore Gateway data plane: required for Harness → Gateway tool calls from inside VPC.
  # This is a SEPARATE endpoint from bedrock-agentcore (data plane).
  # Service name: com.amazonaws.{region}.bedrock-agentcore.gateway
  # PrivateDnsEnabled: true is correct and safe here — its private hosted zone covers
  # the gateway subdomain only; it does NOT conflict with the data plane zone.
  # Without this endpoint, Harness ENIs in private subnets have no route to the Gateway
  # URL and every agentcore_gateway tool fails with [Errno -2] Name or service not known.
  BedrockAgentCoreGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-agentcore.gateway"
      VpcEndpointType: Interface
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true

  # AgentCore control plane: create/update/delete Harness, Memory, Runtime resources
  BedrockAgentCoreControlEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-agentcore-control"
      VpcEndpointType: Interface
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: true

  # The following endpoints are optional but recommended if not already present in the VPC.
  # Uncomment to provision them here, or add them to your existing VPC separately.

  # Bedrock model inference (bedrock:InvokeModel, InvokeModelWithResponseStream)
  # BedrockRuntimeEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-runtime"
  #     VpcEndpointType: Interface
  #     SubnetIds: !Ref PrivateSubnetIds
  #     SecurityGroupIds: [!Ref EndpointSecurityGroup]
  #     PrivateDnsEnabled: true

  # ECR — container image pull API calls
  # EcrApiEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
  #     VpcEndpointType: Interface
  #     SubnetIds: !Ref PrivateSubnetIds
  #     SecurityGroupIds: [!Ref EndpointSecurityGroup]
  #     PrivateDnsEnabled: true

  # ECR — Docker registry protocol (layer pulls from ECR private repos)
  # EcrDkrEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
  #     VpcEndpointType: Interface
  #     SubnetIds: !Ref PrivateSubnetIds
  #     SecurityGroupIds: [!Ref EndpointSecurityGroup]
  #     PrivateDnsEnabled: true

  # CloudWatch Logs — log delivery from Runtime containers
  # CloudWatchLogsEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
  #     VpcEndpointType: Interface
  #     SubnetIds: !Ref PrivateSubnetIds
  #     SecurityGroupIds: [!Ref EndpointSecurityGroup]
  #     PrivateDnsEnabled: true

  # X-Ray — distributed tracing
  # XRayEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.xray"
  #     VpcEndpointType: Interface
  #     SubnetIds: !Ref PrivateSubnetIds
  #     SecurityGroupIds: [!Ref EndpointSecurityGroup]
  #     PrivateDnsEnabled: true

  # CloudWatch Metrics — PutMetricData
  # MonitoringEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.monitoring"
  #     VpcEndpointType: Interface
  #     SubnetIds: !Ref PrivateSubnetIds
  #     SecurityGroupIds: [!Ref EndpointSecurityGroup]
  #     PrivateDnsEnabled: true

  # STS — sts:GetServiceBearerToken used alongside ecr-public:GetAuthorizationToken
  # StsEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
  #     VpcEndpointType: Interface
  #     SubnetIds: !Ref PrivateSubnetIds
  #     SecurityGroupIds: [!Ref EndpointSecurityGroup]
  #     PrivateDnsEnabled: true

  # Lambda — allows Gateway to invoke Lambda functions without traversing NAT.
  # Relevant when the Lambda target itself is NOT VPC-enabled (Lambda VPC-enabled functions
  # are invoked by Gateway directly; this endpoint helps when Lambda is public but you want
  # Gateway→Lambda traffic to stay on the AWS backbone).
  # LambdaEndpoint:
  #   Type: AWS::EC2::VPCEndpoint
  #   Properties:
  #     VpcId: !Ref VpcId
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.lambda"
  #     VpcEndpointType: Interface
  #     SubnetIds: !Ref PrivateSubnetIds
  #     SecurityGroupIds: [!Ref EndpointSecurityGroup]
  #     PrivateDnsEnabled: true

Outputs:
  HarnessSecurityGroupId:
    Value: !Ref HarnessSecurityGroup
  EndpointSecurityGroupId:
    Value: !Ref EndpointSecurityGroup
