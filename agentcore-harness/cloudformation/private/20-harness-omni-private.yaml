# Stack 20 (private) — AgentCore Memory + built-in Code Interpreter + Harness in VPC mode.
# Deploy after 01-iam and 02-network. Pass their outputs as parameters.
AWSTemplateFormatVersion: "2010-09-09"
Description: AgentCore Memory store + code interpreter tool + Harness omni (VPC mode)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
      - Label:
          default: IAM (from stack 01-iam)
        Parameters:
          - HarnessExecutionRoleArn
      - Label:
          default: Network (from stack 02-network)
        Parameters:
          - HarnessPrivateSubnetIds
          - HarnessSecurityGroupId
      - Label:
          default: Memory (Short-Term)
        Parameters:
          - MemoryRetentionDays
          - MemoryContextSlidingWindowSize
      - Label:
          default: Memory (Long-Term) — strategies configured in template
      - Label:
          default: Agent configuration
        Parameters:
          - FoundationModelId
          - AgentMaxIterations
          - AgentTimeoutSeconds
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)
      HarnessExecutionRoleArn:
        default: Harness execution role ARN (01-iam output)
      HarnessPrivateSubnetIds:
        default: Private subnet IDs (comma-separated, same list passed to 02-network)
      HarnessSecurityGroupId:
        default: Harness security group ID (02-network output)
      MemoryRetentionDays:
        default: Event retention (days, 3–365)
      MemoryContextSlidingWindowSize:
        default: Messages injected per invocation
      FoundationModelId:
        default: Bedrock model ID
      AgentMaxIterations:
        default: Max agent loop iterations per invocation
      AgentTimeoutSeconds:
        default: Max duration per invocation (seconds)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]
  HarnessExecutionRoleArn:
    Type: String
    Description: HarnessExecutionRoleArn from stack 01-iam
  HarnessPrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Comma-separated list of existing private subnet IDs
  HarnessSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: HarnessSecurityGroupId from stack 02-network
  MemoryRetentionDays:
    Type: Number
    Default: 7
    MinValue: 3
    MaxValue: 365
    # Default is 7 days because extraction strategies are active in this template.
    # Summarization and Semantic strategies extract knowledge into their namespaces within hours of each session.
    # Once extracted, the source events are redundant — retaining them longer adds storage cost with no benefit.
    # Raise to 30–90 days only if you need raw event history for audit, replay, or debugging purposes.
    # If using a harness WITHOUT memory strategies, use 30+ days — events are the only form of memory.
  MemoryContextSlidingWindowSize:
    Type: Number
    Default: 20
    # Message count is deceptive: each tool-use round = 4 messages (user + tool-call + tool-result + response).
    # 20 messages = ~5 code interpreter rounds before the oldest turns are dropped.
    # 10 is a safer cross-purpose default: ~5 chat turns or ~2-3 tool-use rounds, keeping context lean.
    # Raise toward 20-30 for pure-chat agents; keep at 10 or lower for tool-heavy agents.
  FoundationModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-4-6
  AgentMaxIterations:
    Type: Number
    Default: 200
  AgentTimeoutSeconds:
    Type: Number
    Default: 300

Resources:

  # --- AgentCore Memory store (BYO pattern — explicit resource gives control over strategies and expiry) ---
  #
  # SHORT-TERM memory: raw events (messages, tool calls) written on every invocation.
  #   Scope: per actorId + sessionId. Gives turn-by-turn continuity within a session.
  #   Controlled by: EventExpiryDuration (how long events are kept) and
  #                  MemoryContextSlidingWindowSize on the Harness (how many recent messages are loaded per invocation).
  #
  # LONG-TERM memory: knowledge extracted from events by MemoryStrategies.
  #   Scope: per actorId across sessions. Retrieved via semantic search and injected into context.
  #   Controlled by: which MemoryStrategies are enabled below.
  #
  Memory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: !Sub "${ApplicationName}_${Environment}_vpc_memory"  # Name forces replacement on change
      Description: !Sub "Memory store for ${ApplicationName} ${Environment} VPC harness"
      # SHORT-TERM: retention window for raw session events.
      # Applies per event at write time — does not backfill existing events.
      EventExpiryDuration: !Ref MemoryRetentionDays
      # LONG-TERM: extraction strategies. Each strategy defines what to extract and where to store it.
      # NamespaceTemplates are optional — omit to use the service default shown in each comment.
      # {actorId} and {sessionId} are filled at runtime from the invocation parameters.
      MemoryStrategies:
        # Per-session structural recap of topics, tasks, and decisions.
        # Service default namespace: /strategy/{memoryStrategyId}/actor/{actorId}/session/{sessionId}/
        - SummaryMemoryStrategy:
            Name: SessionSummarizer
            NamespaceTemplates:
              - "/summaries/{actorId}/{sessionId}/"

        # Factual knowledge across sessions: entities, events, deadlines, versions.
        # Service default namespace: /strategy/{memoryStrategyId}/actors/{actorId}/
        - SemanticMemoryStrategy:
            Name: FactExtractor
            NamespaceTemplates:
              - "/facts/{actorId}/"

        # Stylistic settings and user likes/dislikes: shipping preference, coding style, tone.
        # Service default namespace: /strategy/{memoryStrategyId}/actors/{actorId}/
        # - UserPreferenceMemoryStrategy:
        #     Name: PreferenceTracker
        #     NamespaceTemplates:
        #       - "/preferences/{actorId}/"

        # Sequences of multi-turn tool use and event blocks (situation, intent, assessment).
        # Also produces cross-episode reflections. Service has no single default namespace.
        # - EpisodicMemoryStrategy:
        #     Name: EpisodeRecorder
        #     NamespaceTemplates:
        #       - "/episodic/{actorId}/{sessionId}/"

      Tags:
        Application: !Ref ApplicationName  # Memory Tags is a flat Object of String (not Array of Tag)
        Environment: !Ref Environment

  # --- Harness in VPC mode wired to the Memory store ---
  Harness:
    Type: AWS::BedrockAgentCore::Harness
    DependsOn: Memory
    Properties:
      HarnessName: !Sub "${ApplicationName}_${Environment}_vpc_omni"  # HarnessName forces replacement on change
      ExecutionRoleArn: !Ref HarnessExecutionRoleArn
      Model:
        BedrockModelConfig:
          FoundationModelId: !Ref FoundationModelId
          ApiFormat: converse_stream
      SystemPrompt:
        - Text: !Sub "You are a helpful assistant deployed by ${ApplicationName} in the ${Environment} environment. You can write and execute code to analyze data and solve problems. You remember previous conversations and can recall facts about the user."
      Tools:
        # Built-in code interpreter — no custom resource needed; service uses aws.codeinterpreter.v1 automatically.
        # IAM: CodeInterpreterSessionsBuiltin statement in 01-iam.yaml covers the required permissions.
        - Type: agentcore_code_interpreter
          Name: code_interpreter
          Config:
            AgentCoreCodeInterpreter: {}  # CodeInterpreterArn omitted — uses built-in aws.codeinterpreter.v1
      Memory:
        AgentCoreMemoryConfiguration:
          Arn: !GetAtt Memory.MemoryArn       # BYO reference — links this harness to the Memory resource above
          # SHORT-TERM: how many recent messages are loaded from the event store per invocation.
          MemoryContextSlidingWindowSize: !Ref MemoryContextSlidingWindowSize
          # ActorId omitted — callers pass actorId at invoke time to scope memory per user.
          # Set a fixed value here only if all users share the same memory lane.
          # ActorId: default
      Environment:
        AgentCoreRuntimeEnvironment:
          NetworkConfiguration:
            NetworkMode: VPC  # places harness ENIs in private subnets; no inbound public endpoint
            NetworkModeConfig:
              Subnets: !Ref HarnessPrivateSubnetIds
              SecurityGroups:
                - !Ref HarnessSecurityGroupId
      AgentMaxIterations: !Ref AgentMaxIterations
      AgentTimeoutSeconds: !Ref AgentTimeoutSeconds
      Truncation:
        # sliding_window is the right choice when Memory is enabled.
        # SummaryMemoryStrategy already compresses older turns into long-term storage after each session,
        # so the context window only needs to hold the current session's recent turns — not the full history.
        # Using 'summarization' truncation on top of SummaryMemoryStrategy would do similar work twice.
        # Use 'summarization' instead only if Memory is disabled and single-session history must be preserved in full.
        Strategy: sliding_window
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  MemoryArn:
    Value: !GetAtt Memory.MemoryArn
  MemoryId:
    Value: !GetAtt Memory.MemoryId
  HarnessArn:
    Value: !GetAtt Harness.Arn
  HarnessId:
    Value: !GetAtt Harness.HarnessId
  RuntimeArn:
    Value: !GetAtt Harness.Environment.AgentCoreRuntimeEnvironment.AgentRuntimeArn
