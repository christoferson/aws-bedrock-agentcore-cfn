# Stack 1 — IAM. Deploy first; all downstream stacks consume these role ARNs.
# Source for execution role permissions: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness-security.html
AWSTemplateFormatVersion: "2010-09-09"
Description: IAM roles — HarnessExecutionRole, GatewayRole

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: pub
    AllowedValues: [pub, dev, stg, prd]

Resources:

  # --- Harness execution role (assumed by the AgentCore Harness managed loop) ---
  HarnessExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-harness-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId  # prevent confused-deputy attacks
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: harness-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Sid: BedrockModels # allow both sync and streaming inference
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*"

              # Harness pulls its managed container from ECR Public at session start.
              # ecr-public:GetAuthorizationToken + sts:GetServiceBearerToken are both required for ECR Public pulls.
              - Sid: EcrPublicToken
                Effect: Allow
                Action: ecr-public:GetAuthorizationToken
                Resource: "*"

              - Sid: StsEcrPublicBearer # required alongside EcrPublicToken for ECR Public authentication
                Effect: Allow
                Action: sts:GetServiceBearerToken
                Resource: "*"

              - Sid: XRay
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords,
                         xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"

              - Sid: CloudWatchLogsGroup # log group path is runtimes/*, not bedrock-agentcore/*
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DescribeLogStreams]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"

              - Sid: CloudWatchLogsDescribe # DescribeLogGroups requires broader scope
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"

              - Sid: CloudWatchLogsStream
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*"

              - Sid: CloudWatchMetrics # namespace-scoped per service docs
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore

              - Sid: InvokeGateway # wildcard avoids circular dep with gateway stack
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*"

              # Session event store — harness reads/writes session history via memory events on every invocation.
              # RetrieveMemoryRecords added per harness-security.html; replaces the older batch actions.
              - Sid: MemoryEvents
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:DeleteEvent
                  - bedrock-agentcore:RetrieveMemoryRecords  # used for long-term retrieval injection
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/*"

              # Browser sessions — resource account segment is "aws" (built-in browser), not the customer account.
              # StartBrowserSession / StopBrowserSession / UpdateBrowserStream added per harness-security.html.
              - Sid: BrowserSessionsBuiltin
                Effect: Allow
                Action:
                  - bedrock-agentcore:StartBrowserSession
                  - bedrock-agentcore:StopBrowserSession
                  - bedrock-agentcore:GetBrowserSession
                  - bedrock-agentcore:ListBrowserSessions
                  - bedrock-agentcore:UpdateBrowserStream
                  - bedrock-agentcore:ConnectBrowserAutomationStream
                  - bedrock-agentcore:ConnectBrowserLiveViewStream
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:aws:browser/*"  # "aws" account = built-in browser

              # Code interpreter sessions — resource account segment is "aws" (built-in interpreter).
              - Sid: CodeInterpreterSessionsBuiltin
                Effect: Allow
                Action:
                  - bedrock-agentcore:StartCodeInterpreterSession
                  - bedrock-agentcore:StopCodeInterpreterSession
                  - bedrock-agentcore:GetCodeInterpreterSession
                  - bedrock-agentcore:ListCodeInterpreterSessions
                  - bedrock-agentcore:InvokeCodeInterpreter
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:aws:code-interpreter/*"  # "aws" account = built-in interpreter

      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  # --- Gateway service role (assumed by AgentCore Gateway to call the web-search connector) ---
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-harness-gateway-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: gateway-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeGateway
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*"
              - Sid: InvokeWebSearch # resource account segment is "aws" — AWS-managed tool
                Effect: Allow
                Action: bedrock-agentcore:InvokeWebSearch
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:aws:tool/web-search.v1"
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  HarnessExecutionRoleArn:
    Value: !GetAtt HarnessExecutionRole.Arn
  GatewayRoleArn:
    Value: !GetAtt GatewayRole.Arn
