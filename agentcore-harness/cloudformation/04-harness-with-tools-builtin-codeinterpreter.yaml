# 04-harness-with-tools-builtin-codeinterpreter — built-in AgentCore Code Interpreter. No custom container or interpreter resource needed.
AWSTemplateFormatVersion: "2010-09-09"
Description: AgentCore Harness with built-in agentcore_code_interpreter tool

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
      - Label:
          default: IAM (from stack 01-iam)
        Parameters:
          - HarnessExecutionRoleArn
      - Label:
          default: Agent configuration
        Parameters:
          - FoundationModelId
          - AgentMaxIterations
          - AgentTimeoutSeconds
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)
      HarnessExecutionRoleArn:
        default: Harness execution role ARN (01-iam output)
      FoundationModelId:
        default: Bedrock model ID
      AgentMaxIterations:
        default: Max agent loop iterations per invocation
      AgentTimeoutSeconds:
        default: Max duration per invocation (seconds)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: pub
    AllowedValues: [pub, dev, stg, prd]
  HarnessExecutionRoleArn:
    Type: String
    Description: HarnessExecutionRoleArn from stack 01-iam
  FoundationModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-4-6
  AgentMaxIterations:
    Type: Number
    Default: 10
  AgentTimeoutSeconds:
    Type: Number
    Default: 300

Resources:

  # --- Harness with the built-in AgentCore Code Interpreter tool ---
  Harness:
    Type: AWS::BedrockAgentCore::Harness
    Properties:
      HarnessName: !Sub "${ApplicationName}_${Environment}_codeinterpreter"  # HarnessName forces replacement on change
      ExecutionRoleArn: !Ref HarnessExecutionRoleArn
      Model:
        BedrockModelConfig:
          ModelId: !Ref FoundationModelId
          ApiFormat: converse_stream  # streaming converse API; preferred for low-latency responses
      SystemPrompt:
        - Text: "You are a helpful data analysis assistant. You can write and execute code to analyze data and solve problems."
      Tools:
        - Type: agentcore_code_interpreter
          Name: code_interpreter
          Config:
            AgentCoreCodeInterpreter: {}  # CodeInterpreterArn omitted — service uses the built-in aws.codeinterpreter.v1 automatically
      MaxIterations: !Ref AgentMaxIterations
      TimeoutSeconds: !Ref AgentTimeoutSeconds
      Truncation:
        Strategy: sliding_window  # drops oldest messages when context limit is approached
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  HarnessArn:
    Value: !GetAtt Harness.Arn
  HarnessId:
    Value: !GetAtt Harness.HarnessId
  RuntimeArn:
    Value: !GetAtt Harness.Environment.AgentCoreRuntimeEnvironment.AgentRuntimeArn
