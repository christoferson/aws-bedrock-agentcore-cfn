# Stack 2/5 (managed-agentic) — Products knowledge base (fully managed by Bedrock).
# Deploy after 01-iam. Can be deployed in parallel with 03-kb-suppliers.
#
# IDENTICAL to managed-retrieve/02-kb-products.yaml — the KB itself is the same
# regardless of which retrieval API the gateway later exposes. Only 01-iam and
# 04-gateway differ between the two variants.
#
# Bedrock manages the vector store internally — no OpenSearch, S3 Vectors, or
# other backend to provision. StorageConfiguration is omitted entirely.
#
# With EmbeddingModelType: MANAGED the service controls chunking — a
# ChunkingConfiguration is REJECTED ("A chunking strategy cannot be specified
# with a managed embedding model"). VectorIngestionConfiguration is omitted so
# Bedrock applies its managed defaults. Parsing is likewise service-managed
# (SMART_PARSING) and needs no configuration.
# To customize chunking you must switch to EmbeddingModelType: CUSTOM.
#
# Post-deploy steps:
#   1. Upload product documents to the S3 documents bucket:
#        aws s3 cp ./products/ s3://<DocumentsBucketName>/products/ --recursive
#   2. Start ingestion:
#        aws bedrock-agent start-ingestion-job \
#          --knowledge-base-id <KnowledgeBaseId> \
#          --data-source-id <DataSourceId>
#   3. Check ingestion status:
#        aws bedrock-agent get-ingestion-job \
#          --knowledge-base-id <KnowledgeBaseId> \
#          --data-source-id <DataSourceId> \
#          --ingestion-job-id <IngestionJobId>
AWSTemplateFormatVersion: "2010-09-09"
Description: Products knowledge base — Bedrock managed datastore + S3 data source

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
      - Label:
          default: IAM (from stack 01-iam)
        Parameters:
          - KnowledgeBaseRoleArn
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)
      KnowledgeBaseRoleArn:
        default: Knowledge base role ARN (01-iam output)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]
  KnowledgeBaseRoleArn:
    Type: String
    Description: KnowledgeBaseRoleArn from stack 01-iam

Resources:

  # --- S3 bucket for raw product documents ---
  ProductsDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ApplicationName}-${Environment}-products-documents"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  # --- Managed knowledge base — Bedrock owns the vector datastore ---
  # Type: MANAGED — no StorageConfiguration required.
  # EmbeddingModelType: MANAGED — Bedrock selects and manages the embedding model
  # at no extra cost. Also enables the managed reranker (free).
  ProductsKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub "${ApplicationName}-${Environment}-products"
      Description: Product catalog — specifications, pricing, availability, and feature details
      RoleArn: !Ref KnowledgeBaseRoleArn
      KnowledgeBaseConfiguration:
        Type: MANAGED
        ManagedKnowledgeBaseConfiguration:
          EmbeddingModelType: MANAGED
      Tags:
        Application: !Ref ApplicationName
        Environment: !Ref Environment

  # --- Data source (MANAGED_KNOWLEDGE_BASE_CONNECTOR for managed KBs) ---
  # Managed KBs use Type: MANAGED_KNOWLEDGE_BASE_CONNECTOR, not Type: S3.
  # ConnectorParameters is a free-form JSON blob; bucket reference goes inside
  # connectionConfiguration.
  #
  # VectorIngestionConfiguration is intentionally omitted: with a managed
  # embedding model the service rejects a ChunkingConfiguration and manages
  # chunking + parsing itself. Add it back only under EmbeddingModelType: CUSTOM.
  ProductsDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref ProductsKnowledgeBase
      Name: !Sub "${ApplicationName}-${Environment}-products-s3"
      Description: Product documents from S3
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: MANAGED_KNOWLEDGE_BASE_CONNECTOR
        ManagedKnowledgeBaseConnectorConfiguration:
          ConnectorParameters:
            type: S3
            version: "1"
            connectionConfiguration:
              bucketName: !Sub "${ApplicationName}-${Environment}-products-documents"
              bucketOwnerAccountId: !Ref AWS::AccountId
            # Read <filename>.md.metadata.json sidecars from the same prefix as the
            # documents. Enables metadata filtering at query time (material,
            # price_band, unit_price, etc.). Managed KBs support equals/notEquals/
            # greaterThan/lessThan/in/notIn — NOT startsWith or stringContains.
            metadataFilesPrefix: products/

Outputs:
  KnowledgeBaseId:
    Value: !Ref ProductsKnowledgeBase
  KnowledgeBaseArn:
    Value: !GetAtt ProductsKnowledgeBase.KnowledgeBaseArn
  DataSourceId:
    Value: !GetAtt ProductsDataSource.DataSourceId
  DocumentsBucketName:
    Value: !Ref ProductsDocumentsBucket
