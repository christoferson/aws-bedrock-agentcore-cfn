# Stack 1/5 (managed-agentic) — IAM roles for the managed knowledge base stack set.
# Deploy first. Pass KnowledgeBaseRoleArn to stacks 02 and 03, GatewayRoleArn to stack 04.
#
# Managed KBs do not need vector store permissions — Bedrock owns the datastore.
# The KB role only needs S3 read access for ingestion.
#
# VARIANT NOTE (managed-agentic): the GatewayRole grants AgenticRetrieveStream in
# addition to Retrieve, because 04-gateway exposes the AgenticRetrieveStream tool.
# The managed-retrieve variant omits the AgenticRetrieve statement.
AWSTemplateFormatVersion: "2010-09-09"
Description: IAM roles for managed knowledge base — agentic retrieval variant

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]

Resources:

  # --- Role assumed by Bedrock during ingestion (reads S3 documents) ---
  # Managed KB: no vector store permissions needed — Bedrock owns the datastore.
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-managed-kb-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: KnowledgeBasePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3DocumentsRead
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:aws:s3:::${ApplicationName}-${Environment}-*-documents"
                  - !Sub "arn:aws:s3:::${ApplicationName}-${Environment}-*-documents/*"

  # --- Role assumed by AgentCore Gateway when querying knowledge bases ---
  # Agentic variant: needs Retrieve + AgenticRetrieveStream + GetKnowledgeBase.
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-managed-kb-gateway-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: GatewayKnowledgeBasePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RetrieveFromKnowledgeBases
                Effect: Allow
                Action: [bedrock:Retrieve, bedrock:GetKnowledgeBase]
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
              - Sid: AgenticRetrieve
                # Required because 04-gateway exposes the AgenticRetrieveStream tool.
                Effect: Allow
                Action: bedrock:AgenticRetrieveStream
                Resource: "*"

Outputs:
  KnowledgeBaseRoleArn:
    Value: !GetAtt KnowledgeBaseRole.Arn
  GatewayRoleArn:
    Value: !GetAtt GatewayRole.Arn
