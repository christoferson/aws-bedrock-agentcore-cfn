# Stack 1/4 (s3-vector) — Shared KnowledgeBaseRole + individual S3 Vectors buckets.
# Products and suppliers each get their own vector bucket (Bedrock manages the index inside each).
# Deploy first. Pass outputs as parameters to stacks 03, 04, and 05.
#
# NOTE: AWS::S3Vectors::VectorBucket is a newer resource type (S3 Vectors GA 2025).
# Verify CFN support in your region before deploying. If unavailable, create the buckets via CLI:
#   aws s3vectors create-vector-bucket --vector-bucket-name <ApplicationName>-<Environment>-products-vectors
#   aws s3vectors create-vector-bucket --vector-bucket-name <ApplicationName>-<Environment>-suppliers-vectors
# Then pass the ARNs directly as parameters to stacks 03 and 04.
AWSTemplateFormatVersion: "2010-09-09"
Description: KnowledgeBase IAM role and S3 Vectors buckets for products and suppliers

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]

Resources:

  # --- Role assumed by Bedrock for embedding and reading documents ---
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-kb-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: KnowledgeBasePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EmbeddingModels
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
              - Sid: DocumentsRead
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:aws:s3:::${ApplicationName}-${Environment}-*-documents"
                  - !Sub "arn:aws:s3:::${ApplicationName}-${Environment}-*-documents/*"
              - Sid: VectorStoreAccess
                # S3 Vectors data-plane permissions for both vector buckets
                Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:ListVectors
                  - s3vectors:GetIndex
                  - s3vectors:ListIndexes
                  - s3vectors:GetVectorBucket
                Resource:
                  - !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ApplicationName}-${Environment}-*-vectors"
                  - !Sub "arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${ApplicationName}-${Environment}-*-vectors/index/*"

  # --- S3 Vectors bucket for products KB ---
  # Bedrock creates and manages the vector index inside this bucket at KB creation time.
  ProductsVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub "${ApplicationName}-${Environment}-products-vectors"

  # --- S3 Vectors bucket for suppliers KB ---
  SuppliersVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub "${ApplicationName}-${Environment}-suppliers-vectors"

Outputs:
  KnowledgeBaseRoleArn:
    Value: !GetAtt KnowledgeBaseRole.Arn
  ProductsVectorBucketArn:
    Value: !GetAtt ProductsVectorBucket.Arn
  SuppliersVectorBucketArn:
    Value: !GetAtt SuppliersVectorBucket.Arn
