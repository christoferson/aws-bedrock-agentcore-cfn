version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - docker buildx create --use

  build:
    commands:
      - docker buildx build --platform linux/arm64 --provenance=false -t $ECR_REPO_URI:$IMAGE_TAG -t $ECR_REPO_URI:latest --push .

  post_build:
    commands:
      - echo "{\"imageUri\":\"$ECR_REPO_URI:$IMAGE_TAG\"}" > imageDetail.json
      - echo "Build complete. Image pushed as $ECR_REPO_URI:$IMAGE_TAG"

artifacts:
  files:
    - imageDetail.json
