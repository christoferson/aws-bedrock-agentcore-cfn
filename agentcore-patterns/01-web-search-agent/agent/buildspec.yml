version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo "Image tag is $IMAGE_TAG"

  build:
    commands:
      - echo "Building Docker image..."
      - docker build --platform linux/arm64 -t $ECR_REPO_URI:$IMAGE_TAG -t $ECR_REPO_URI:latest .

  post_build:
    commands:
      - echo "Pushing Docker image to ECR..."
      - docker push $ECR_REPO_URI:$IMAGE_TAG
      - docker push $ECR_REPO_URI:latest
      - echo "{\"imageUri\":\"$ECR_REPO_URI:$IMAGE_TAG\"}" > imageDetail.json
      - echo "Build complete. Image pushed as $ECR_REPO_URI:$IMAGE_TAG"

artifacts:
  files:
    - imageDetail.json