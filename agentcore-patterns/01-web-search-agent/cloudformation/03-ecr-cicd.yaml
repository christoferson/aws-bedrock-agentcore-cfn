# Stack 3/5 — CI/CD. Upload agent/source.zip to SourceBucket; the pipeline builds and pushes the ECR image.
AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository, S3 source bucket, CodeBuild (ARM64), CodePipeline

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
      - Label:
          default: IAM (from stack 01-iam)
        Parameters:
          - CodeBuildRoleArn
          - CodePipelineRoleArn
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)
      CodeBuildRoleArn:
        default: CodeBuild role ARN (01-iam output)
      CodePipelineRoleArn:
        default: CodePipeline role ARN (01-iam output)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]
  CodeBuildRoleArn:
    Type: String
    Description: CodeBuildRole ARN from stack 01-iam
  CodePipelineRoleArn:
    Type: String
    Description: CodePipelineRole ARN from stack 01-iam

Resources:

  # --- ECR repository — stores ARM64 agent container images ---
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ApplicationName}-${Environment}-web-search-agent"
      ImageScanningConfiguration:
        ScanOnPush: true # basic CVE scan on every push; no extra cost
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 15 images",
              "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 15},
              "action": {"type": "expire"}
            }]
          }
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  # --- S3 source bucket (versioning required — CodePipeline S3 source detects new object versions) ---
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ApplicationName}-${Environment}-source-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled # CodePipeline S3 source requires versioning to detect changes
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced # disables ACLs; BucketOwnerEnforced is required for PutObject without ACL header
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  SourceBucketPolicy:
    Type: AWS::S3::BucketPolicy # denies any non-HTTPS access to the source bucket
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SourceBucket.Arn
              - !Sub "${SourceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # --- Artifact bucket — CodePipeline stores inter-stage artifacts here ---
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ApplicationName}-${Environment}-artifacts-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  # --- CodeBuild project (ARM64, PrivilegedMode for Docker daemon) ---
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ApplicationName}-${Environment}-build"
      ServiceRole: !Ref CodeBuildRoleArn
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0 # ARM64 image for linux/arm64 platform builds
        PrivilegedMode: true # required to run the Docker daemon inside CodeBuild
        EnvironmentVariables:
          - Name: ECR_REPO_URI
            Value: !GetAtt EcrRepository.RepositoryUri
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml # reads from agent/buildspec.yml in the source zip
      Artifacts:
        Type: CODEPIPELINE
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  # --- CodePipeline (S3 source → CodeBuild; polls every minute via PollForSourceChanges) ---
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ApplicationName}-${Environment}-pipeline"
      RoleArn: !Ref CodePipelineRoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: S3Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket: !Ref SourceBucket
                S3ObjectKey: source.zip # upload agent folder zipped as source.zip to trigger a build
                PollForSourceChanges: true # EventBridge not available for S3 source in all accounts
              OutputArtifacts:
                - Name: SourceArtifact
        - Name: Build
          Actions:
            - Name: CodeBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  SourceBucketName:
    Value: !Ref SourceBucket
  PipelineName:
    Value: !Ref Pipeline
