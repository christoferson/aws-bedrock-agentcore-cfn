# Stack 1/5 — IAM. Deploy first; all downstream stacks consume these role ARNs.
AWSTemplateFormatVersion: "2010-09-09"
Description: IAM roles — ExecutionRole, GatewayRole, CodeBuildRole, CodePipelineRole

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ApplicationName
          - Environment
    ParameterLabels:
      ApplicationName:
        default: Application name prefix
      Environment:
        default: Deployment environment (dev / stg / prd)

Parameters:
  ApplicationName:
    Type: String
    Default: coreagent
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]

Resources:

  # --- Runtime execution role (assumed by the AgentCore Runtime container) ---
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId  # prevent confused-deputy attacks
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: execution-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRImageAccess # pull image layers from ECR
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*"
              - Sid: ECRTokenAccess # get-login-token is global, not per-repo
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: CloudWatchLogs # runtime writes structured logs here
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents,
                         logs:DescribeLogGroups, logs:DescribeLogStreams]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"
              - Sid: XRay
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords,
                         xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"
              - Sid: CloudWatchMetrics # namespace-scoped per service docs
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: BedrockModels # allow both sync and streaming inference
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*"
              - Sid: InvokeGateway # wildcard avoids a circular dep with the gateway stack
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*"
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  # --- Gateway service role (assumed by AgentCore Gateway to call the web-search connector) ---
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-gateway-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: gateway-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeGateway
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*"
              - Sid: InvokeWebSearch # resource account segment is "aws" — this is an AWS-managed tool
                Effect: Allow
                Action: bedrock-agentcore:InvokeWebSearch
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:aws:tool/web-search.v1"
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  # --- CodeBuild service role (builds and pushes the agent container image) ---
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codebuild-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRPush # full push lifecycle; GetAuthorizationToken is global
                Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:CompleteLayerUpload,
                         ecr:InitiateLayerUpload, ecr:PutImage, ecr:UploadLayerPart,
                         ecr:GetAuthorizationToken]
                Resource: "*"
              - Sid: S3Artifacts # read source zip, write build artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub "arn:aws:s3:::${ApplicationName}-${Environment}-*/*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  # --- CodePipeline service role (orchestrates Source → Build stages) ---
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-codepipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codepipeline-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Artifacts # GetBucketVersioning required for S3 source detection
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning]
                Resource:
                  - !Sub "arn:aws:s3:::${ApplicationName}-${Environment}-*"
                  - !Sub "arn:aws:s3:::${ApplicationName}-${Environment}-*/*"
              - Sid: TriggerCodeBuild
                Effect: Allow
                Action: [codebuild:BatchGetBuilds, codebuild:StartBuild]
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/*"
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  GatewayRoleArn:
    Value: !GetAtt GatewayRole.Arn
  CodeBuildRoleArn:
    Value: !GetAtt CodeBuildRole.Arn
  CodePipelineRoleArn:
    Value: !GetAtt CodePipelineRole.Arn
