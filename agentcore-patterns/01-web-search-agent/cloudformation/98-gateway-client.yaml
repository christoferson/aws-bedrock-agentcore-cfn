AWSTemplateFormatVersion: "2010-09-09"
Description: Lambda test client for the AgentCore Gateway (MCP over HTTPS, AWS_IAM auth)

Parameters:
  ApplicationName:
    Type: String
    Default: bedrock-agentcore
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prd]
  GatewayArn:
    Type: String
    Description: GatewayArn from stack 04-gateway
  GatewayUrl:
    Type: String
    Description: GatewayUrl from stack 04-gateway

Resources:

  GatewayClientRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${Environment}-gateway-client-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: gateway-client-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeGateway
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Ref GatewayArn
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"
      Tags:
        - Key: Application
          Value: !Ref ApplicationName
        - Key: Environment
          Value: !Ref Environment

  GatewayClientFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ApplicationName}-${Environment}-gateway-client"
      Description: MCP test client for the AgentCore Gateway
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt GatewayClientRole.Arn
      Timeout: 30
      Environment:
        Variables:
          GATEWAY_URL: !Ref GatewayUrl
          AWS_REGION_NAME: !Ref AWS::Region
      Code:
        ZipFile: |
          import os
          import json
          import urllib.request
          import boto3
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          from botocore.credentials import Credentials

          GATEWAY_URL = os.environ["GATEWAY_URL"]
          REGION = os.environ["AWS_REGION_NAME"]
          SESSION = boto3.session.Session()

          def signed_request(body: dict) -> dict:
              payload = json.dumps(body).encode()
              req = AWSRequest(
                  method="POST",
                  url=GATEWAY_URL,
                  data=payload,
                  headers={"Content-Type": "application/json"},
              )
              creds = SESSION.get_credentials().get_frozen_credentials()
              SigV4Auth(creds, "bedrock-agentcore", REGION).add_auth(req)
              prepared = req.prepare()
              http_req = urllib.request.Request(
                  GATEWAY_URL,
                  data=payload,
                  headers=dict(prepared.headers),
                  method="POST",
              )
              with urllib.request.urlopen(http_req, timeout=25) as resp:
                  raw = resp.read().decode()
              try:
                  return json.loads(raw)
              except Exception:
                  return {"raw": raw}

          def handler(event, context):
              # event.action: "list_tools" (default) or "search"
              # event.query: search query string (required when action="search")
              action = event.get("action", "list_tools")

              if action == "list_tools":
                  result = signed_request({"jsonrpc": "2.0", "method": "tools/list", "id": 1})

              elif action == "search":
                  query = event.get("query")
                  if not query:
                      return {"statusCode": 400, "body": "Missing 'query' for action=search"}
                  result = signed_request({
                      "jsonrpc": "2.0",
                      "method": "tools/call",
                      "id": 1,
                      "params": {
                          "name": "WebSearch",
                          "arguments": {"query": query},
                      },
                  })
              else:
                  return {"statusCode": 400, "body": f"Unknown action: {action}"}

              return {"statusCode": 200, "body": result}
      Tags:
        Application: !Ref ApplicationName
        Environment: !Ref Environment

  GatewayClientLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GatewayClientFunction}"
      RetentionInDays: 7

Outputs:
  GatewayClientFunctionName:
    Value: !Ref GatewayClientFunction
