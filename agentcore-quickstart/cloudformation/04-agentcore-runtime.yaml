AWSTemplateFormatVersion: "2010-09-09"
Description: >
  The AgentCore Runtime that hosts the Strands agent. Creates
  AWS::BedrockAgentCore::Runtime in VPC network mode, running the ARM64 agent
  image from ECR inside private subnets, assuming the runtime execution role to
  invoke Bedrock models. Updating the container image rolls a new immutable
  runtime version and the DEFAULT endpoint with no downtime.

Parameters:
  ApplicationName:
    Type: String
    Default: bedrock-agentcore
  Environment:
    Type: String
    Default: prd
    AllowedValues: [dev, stg, prd]
  AgentName:
    Type: String
    Description: AgentRuntimeName (pattern [a-zA-Z][a-zA-Z0-9_]{0,47}).
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]{0,47}"
  ContainerImageUri:
    Type: String
    Description: >
      Full ECR image URI WITH tag or digest, e.g.
      123456789012.dkr.ecr.us-east-1.amazonaws.com/bedrock-agentcore-prd:ab12cd34
      (EcrRepositoryUri from the CI/CD stack + the tag from imageDetail.json).
    AllowedPattern: "^\\d{12}\\.dkr\\.ecr\\.([a-z0-9-]+)\\.amazonaws\\.com/.+[:@]\\S+$"
  AgentCoreRuntimeExecutionRoleArn:
    Type: String
    Description: From the IAM foundation stack Output AgentCoreRuntimeExecutionRoleArn.
  AgentCoreRuntimePrivateSubnetList:
    Type: List<AWS::EC2::Subnet::Id>
    Description: From the network stack Output PrivateSubnetIds.
  AgentCoreRuntimeSecurityGroupList:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: From the network stack Output RuntimeSecurityGroupId.
  Protocol:
    Type: String
    Default: HTTP
    AllowedValues: [HTTP, MCP, A2A, AGUI]
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: Passed to the agent container as the BEDROCK_MODEL_ID env var.

Resources:
  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Ref AgentName
      Description: !Sub "${ApplicationName} Strands agent (${Environment})"
      RoleArn: !Ref AgentCoreRuntimeExecutionRoleArn
      ProtocolConfiguration: !Ref Protocol
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref ContainerImageUri
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets: !Ref AgentCoreRuntimePrivateSubnetList
          SecurityGroups: !Ref AgentCoreRuntimeSecurityGroupList
      EnvironmentVariables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
      Tags:
        Application: !Ref ApplicationName
        Environment: !Ref Environment

Outputs:
  AgentRuntimeArn:
    Value: !GetAtt AgentRuntime.AgentRuntimeArn
  AgentRuntimeId:
    Value: !GetAtt AgentRuntime.AgentRuntimeId
  AgentRuntimeVersion:
    Value: !GetAtt AgentRuntime.AgentRuntimeVersion
  AgentRuntimeStatus:
    Value: !GetAtt AgentRuntime.Status
