AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Networking for the AgentCore Runtime: a VPC with public and private subnets
  across two Availability Zones, an internet gateway for the public subnets, a
  NAT gateway giving the private subnets outbound internet access, and a
  security group for the runtime ENIs. The runtime runs in the private subnets
  and reaches AWS services (Bedrock, AgentCore, ECR, CloudWatch, X-Ray) through
  the NAT gateway. Public subnets are available for future internet-facing
  resources.

Parameters:
  ApplicationName:
    Type: String
    Default: bedrock-agentcore
  Environment:
    Type: String
    Default: prd
    AllowedValues: [dev, stg, prd]
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetOneCidr:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnetTwoCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetOneCidr:
    Type: String
    Default: 10.0.10.0/24
  PrivateSubnetTwoCidr:
    Type: String
    Default: 10.0.11.0/24

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-vpc" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-igw" }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetOneCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-public-1" }

  PublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetTwoCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-public-2" }

  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetOneCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-private-1" }

  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetTwoCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-private-2" }

  # ---- Public routing: subnets reach the internet via the internet gateway ----
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-public-routetable" }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetOne

  PublicSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetTwo

  # ---- NAT gateway: outbound internet for the private subnets ----
  NatGatewayElasticIpAddress:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-nat-eip" }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayElasticIpAddress.AllocationId
      SubnetId: !Ref PublicSubnetOne
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-nat" }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-private-routetable" }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetOne

  PrivateSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetTwo

  # Security group attached to the AgentCore Runtime ENIs. Outbound HTTPS only.
  AgentCoreRuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ApplicationName}-${Environment} AgentCore Runtime security group"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: HTTPS to AWS services via the NAT gateway
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: !Sub "${ApplicationName}-${Environment}-runtime-securitygroup" }

Outputs:
  VpcId:
    Value: !Ref Vpc
  PublicSubnetIds:
    Description: Comma-separated public subnet IDs (for future internet-facing resources).
    Value: !Join [",", [!Ref PublicSubnetOne, !Ref PublicSubnetTwo]]
  PrivateSubnetIds:
    Description: Comma-separated private subnet IDs. Feed into the runtime stack as AgentCoreRuntimePrivateSubnetList.
    Value: !Join [",", [!Ref PrivateSubnetOne, !Ref PrivateSubnetTwo]]
  AgentCoreRuntimeSecurityGroupId:
    Description: Feed into the runtime stack as AgentCoreRuntimeSecurityGroupList.
    Value: !Ref AgentCoreRuntimeSecurityGroup
